{% extends 'mailings/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
{% include 'mailings/header.html' %}

<div class="container">
    <div class="row">
        <div class="col">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary">
                    Войти
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
