<header>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/">Главная</a>
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:mailing_list' %}">Список рассылок</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:message_list' %}">Список сообщений</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:recipient_list' %}">Список получателей</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:user_list' %}">Список пользователей</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:mailing_attempt' %}">Попытка рассылки</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:user_detail' %}">Профиль</a>
        {% else %}
        {% endif %}
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'users:logout' %}" style="display: inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">

</div>
</header>
