{% extends 'mailings/base.html' %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}
{% include 'mailings/header.html' %}

<div class="container">
    <div class="row">
        <div class="col">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card-body">
                    {% csrf_token %}
                </div>
                <p class="card-text">Вы действительно хотите удалить получателя?{{object.name}}</p>
                <button type="submit" class="btn btn-primary mb-2">Удалить</button>
                <a href="/" class="btn btn-primary mb-2">Отменить</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
