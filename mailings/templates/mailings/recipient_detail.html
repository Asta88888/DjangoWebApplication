{% extends 'mailings/base.html' %}

{% block title %}Детали получателя{% endblock %}

{% block content %}
{% include 'mailings/header.html' %}
<h2>Детали получателя</h2>

<div class="card" style="width: 18rem;">
  <div class="card-body">
    <h5 class="card-title">{{ object.email }}</h5>
    <p class="card-text">{{ object.full_name }}</p>
    <p class="card-text">{{ object.comment }}</p>
      <div>
          <a href="{% url 'mailings:recipient_update' recipient.pk %}" class="btn btn-primary mb-2">Внести изменения</a>
          <a href="{% url 'mailings:recipient_delete' recipient.pk %}" class="btn btn-primary mb-2">Удалить</a>
      </div>
    <a href="/" class="btn btn-primary">Вернуться назад</a>
  </div>
</div>

{% endblock %}
